<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-line-component.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Line</h1>
    <p>Três linhas formam um triângulo.</p>
    <a class="fonte" href="https://github.com/fernandojsg/aframe-line-component">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" >
    <a-entity id="olhar" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-entity line="start: -1 1 -3; end: 1 1 -3; color: #ffc777"></a-entity>
    <a-entity line="start: 1 1 -3; end: 0 2.5 -3; color: #ffc777"></a-entity>
    <a-entity line="start: 0 2.5 -3; end: -1 1 -3; color: #ffc777"></a-entity>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
</body>
</html>
