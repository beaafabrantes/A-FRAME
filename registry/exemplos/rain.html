<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rain · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-rain.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Rain</h1>
    <p>Observa a chuva a cair à volta do cubo.</p>
    <a class="fonte" href="https://github.com/takahirox/aframe-rain">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" rain="count: 1800; vector: 1 -9 0; width: 12; height: 7">
    <a-entity id="olhar" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-box id="alvo" position="0 1.6 -3" rotation="12 28 0" color="#ed9b60"></a-box>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
</body>
</html>
