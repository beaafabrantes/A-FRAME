<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Geometry · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-text-geometry-component.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Text Geometry</h1>
    <p>O texto tem espessura. Usa A e D para o observar de lado.</p>
    <a class="fonte" href="https://github.com/ngokevin/kframe">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" >
    <a-entity id="olhar" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-entity position="-1.2 1.35 -3.4" rotation="0 -12 0" material="color: #f5bd76" text-geometry="value: A-FRAME; font: ../assets/typeface.json; size: .48; height: .14"></a-entity>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
</body>
</html>
