<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics System · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-physics-system.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Physics System</h1>
    <p>O cubo cai na plataforma. Clica em Recomeçar para repetir.</p>
    <button onclick="location.reload()">Recomeçar</button>
    <a class="fonte" href="https://github.com/donmccurdy/aframe-physics-system">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" physics>
    <a-entity id="olhar" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-box static-body position="0 .32 -4" width="3" height=".3" depth="2" color="#599d96"></a-box>
    <a-box dynamic-body position="0 3.5 -4" rotation="10 10 18" color="#ed9b60"></a-box>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
</body>
</html>
