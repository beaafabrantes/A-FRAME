<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Set · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-event-set-component.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Event Set</h1>
    <p>Centra a mira no cubo e clica para o tornar verde.</p>
    <a class="fonte" href="https://github.com/ngokevin/aframe-event-set-component">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" >
    <a-entity camera look-controls position="0 1.6 0"><a-cursor raycaster="objects: .interativo"></a-cursor></a-entity>
    <a-box id="alvo" class="interativo" event-set__mudar="_event: click; material.color: #49d4aa" position="0 1.6 -3" rotation="12 28 0" color="#ed9b60"></a-box>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
</body>
</html>
