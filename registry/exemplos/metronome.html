<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metronome · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-metronome-component.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Metronome</h1>
    <p>As esferas acendem à vez, a um ritmo regular.</p>
    <a class="fonte" href="https://github.com/rserota/aframe-metronome-component">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" >
    <a-entity id="olhar" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-entity id="relogio" metronome="bpm: 90; beatsPerBar: 4"></a-entity>
    <a-sphere class="batida" position="-1.2 1.6 -3" radius=".23"></a-sphere><a-sphere class="batida" position="-0.4 1.6 -3" radius=".23"></a-sphere><a-sphere class="batida" position="0.4 1.6 -3" radius=".23"></a-sphere><a-sphere class="batida" position="1.2 1.6 -3" radius=".23"></a-sphere>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
  <script>
    const scene = document.querySelector('a-scene');
    function iniciar() {
      let indice = 0;
      document.querySelector('#relogio').addEventListener('beat', () => {
        document.querySelectorAll('.batida').forEach((el, i) => el.setAttribute('color', i === indice ? '#ffbc60' : '#41606b'));
        indice = (indice + 1) % 4;
      });
    }
    if (scene.hasLoaded) iniciar();
    else scene.addEventListener('loaded', iniciar, {once: true});
  </script>
</body>
</html>
