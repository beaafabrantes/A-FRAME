<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lerp · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-lerp-component.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Lerp</h1>
    <p>A esfera move-se suavemente de um lado para o outro.</p>
    <a class="fonte" href="https://github.com/haydenjameslee/aframe-lerp-component">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" >
    <a-entity id="olhar" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-sphere id="alvo" lerp="properties: position" position="-1 1.6 -3" radius=".35" color="#67d9bb"></a-sphere>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
  <script>
    const scene = document.querySelector('a-scene');
    function iniciar() {
      let passo = 0;
      setInterval(() => {
        passo++;
        document.querySelector('#alvo').setAttribute('position', {x: Math.sin(passo * .55) * 1.4, y: 1.6, z: -3});
      }, 180);
    }
    if (scene.hasLoaded) iniciar();
    else scene.addEventListener('loaded', iniciar, {once: true});
  </script>
</body>
</html>
