<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slice9 · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-slice9-component.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Slice9</h1>
    <p>Os dois painéis usam a mesma imagem com larguras diferentes.</p>
    <a class="fonte" href="https://github.com/fernandojsg/aframe-slice9-component">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" >
    <a-entity id="olhar" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-entity position="0 2.2 -3.5" slice9="src: ../assets/panel.png; width: 1.2; height: .85; left: 8; right: 8; top: 8; bottom: 8; padding: .12"></a-entity>
    <a-entity position="0 1 -3.5" slice9="src: ../assets/panel.png; width: 2.8; height: .85; left: 8; right: 8; top: 8; bottom: 8; padding: .12"></a-entity>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
</body>
</html>
