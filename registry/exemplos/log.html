<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log · A-Frame Registry</title>
  <link rel="stylesheet" href="../estilo.css">
  <script src="../lib/aframe-0.5.0.js"></script>
  <script src="../lib/aframe-log-component.js"></script>
</head>
<body class="demo">
  <aside>
    <a class="voltar" href="../index.html">← Voltar aos exemplos</a>
    <h1>Log</h1>
    <p>Clica no botão para acrescentar uma mensagem ao painel.</p>
    <button id="nota">Adicionar mensagem</button>
    <a class="fonte" href="https://github.com/ngokevin/kframe">Código do autor ↗</a>
  </aside>
  <a-scene vr-mode-ui="enabled: false" >
    <a-entity id="olhar" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-entity position="0 1.6 -3" log="max: 5" geometry="primitive: plane; width: 3; height: 1.5" material="color: #182f3b" text="font: ../assets/mozillavr.fnt; width: 2.7; align: center; color: #91e6c5"></a-entity>
    <a-plane class="superficie" rotation="-90 0 0" width="80" height="80" color="#354d57"></a-plane>
    <a-sky color="#233a4b"></a-sky>
  </a-scene>
  <script>
    const scene = document.querySelector('a-scene');
    function iniciar() {
      let total = 0;
      function anotar() { AFRAME.log('Mensagem ' + (++total)); }
      document.querySelector('#nota').onclick = anotar;
      anotar();
    }
    if (scene.hasLoaded) iniciar();
    else scene.addEventListener('loaded', iniciar, {once: true});
  </script>
</body>
</html>
