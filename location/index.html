<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR baseada em localização</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

    <a-text
      value="Bem-vindo a Braganca!"
      color="#FFFFFF"
      align="center"
      look-at="[gps-new-camera]"
      scale="50 50 50"
      gps-new-entity-place="latitude: 41.8061; longitude: -6.7567;">
    </a-text>

    <a-box
      color="#FF0000"
      width="3"
      height="3"
      depth="3"
      position="0 2 0"
      gps-new-entity-place="latitude: 41.8065; longitude: -6.7570;">
    </a-box>

    <a-cylinder
      color="#00FF00"
      radius="1.5"
      height="4"
      position="0 2 0"
      gps-new-entity-place="latitude: 41.8058; longitude: -6.7563;">
    </a-cylinder>

    <a-sphere
      color="#0000FF"
      radius="2"
      position="0 3 0"
      gps-new-entity-place="latitude: 41.8070; longitude: -6.7550;">
    </a-sphere>
  </a-scene>
</body>
</html>
